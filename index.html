<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OisinMG</title>
  <meta name="description" content="Projects by Oisín.">
  <link rel="icon" href="data:,">
  <style>
    :root { --bg: #0e1116; --card: #161b22; --text: #e8ecf1; --dim: #9aa4b1; --accent: #ffb01a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.5; }
    main { max-width: 960px; margin: 0 auto; padding: 72px 16px 48px; }
    h1 { margin: 0; font-size: clamp(36px, 7vw, 56px); letter-spacing: 0.02em; }
    .lead { margin: 8px 0 48px; color: var(--dim); font-size: 18px; }
    h2 { font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin: 0 0 16px; }
    .project { display: block; background: var(--card); border-radius: 10px; overflow: hidden; color: inherit; text-decoration: none; border: 1px solid #222a35; transition: transform 0.15s, border-color 0.15s; }
    .project:hover { transform: translateY(-2px); border-color: var(--accent); }
    .project img { display: block; width: 100%; height: auto; aspect-ratio: 960 / 420; object-fit: cover; }
    .info { padding: 20px 22px 24px; }
    .info h3 { margin: 0 0 6px; font-size: 24px; }
    .info p { margin: 0 0 16px; color: var(--dim); }
    .play { display: inline-block; background: var(--accent); color: #111; font-weight: 600; padding: 8px 18px; border-radius: 6px; }
    .keys { font-size: 14px; color: var(--dim); margin-top: 14px; }
    footer { margin-top: 64px; color: var(--dim); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>OisinMG</h1>
    <p class="lead">Things I've been making.</p>

    <h2>Projects</h2>
    <a class="project" href="/RacingProject/">
      <img src="racing.jpg" alt="A blue drift car on a snowy mountain road" width="960" height="420">
      <div class="info">
        <h3>Racing Project</h3>
        <p>A driving test made in Unity: one car, a snowy mountain circuit, unlimited laps. Plays in the browser.</p>
        <span class="play">Play</span>
        <div class="keys">Keyboard: W/S throttle &amp; brake (hold S to reverse) &middot; A/D steer &middot; Space handbrake &middot; R reset</div>
      </div>
    </a>

    <footer>&copy; Oisín &middot; oisinmg.ie</footer>
  </main>
</body>
</html>
